<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" font-family="sans-serif" font-size="15" fill="#000">
  <!-- 2D fin with spatially varying k and Q -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <polygon points="160,240 480,240 480,80 160,80" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <rect x="160" y="80" width="320" height="40" fill="#000" fill-opacity="0.1"/>
  <line x1="320" y1="240" x2="320" y2="120" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="320" y="262" text-anchor="middle"><tspan font-style="italic">T</tspan> = 200 °C</text>
  <text x="320" y="278" font-size="12" fill="#666" text-anchor="middle">boundary "0"</text>
  <text x="146" y="160" text-anchor="middle" transform="rotate(-90 146 160)">Symmetry</text>
  <text x="130" y="160" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 130 160)">boundary "1"</text>
  <text x="320" y="68" text-anchor="middle">Convection, <tspan font-style="italic">h</tspan> = 1 W/(m²·K), <tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">∞</tspan><tspan dy="-4"></tspan> = 20 °C</text>
  <text x="320" y="50" font-size="12" fill="#666" text-anchor="middle">boundary "2"</text>
  <text x="500" y="160" text-anchor="middle" transform="rotate(90 500 160)"><tspan font-style="italic">T</tspan> = 200 °C</text>
  <text x="516" y="160" font-size="12" fill="#666" text-anchor="middle" transform="rotate(90 516 160)">boundary "3"</text>
  <text x="240" y="180" text-anchor="middle"><tspan font-style="italic">k</tspan> = 10 W/(m·K)</text>
  <text x="400" y="180" text-anchor="middle"><tspan font-style="italic">k</tspan> = 1 W/(m·K)</text>
  <text x="320" y="105.6" text-anchor="middle"><tspan font-style="italic">Q</tspan> = 500 W/m³ (y &gt; 1.5 m)</text>
  <circle cx="160" cy="240" r="3" fill="#000" stroke="#000" stroke-width="1"/>
  <text x="154" y="260" font-size="13" text-anchor="middle">(0, 0)</text>
  <line x1="160" y1="310" x2="480" y2="310" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320" y="330" text-anchor="middle">4 m</text>
  <line x1="80" y1="240" x2="80" y2="80" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="70" y="160" text-anchor="middle" transform="rotate(-90 70 160)">2 m</text>
</svg>
