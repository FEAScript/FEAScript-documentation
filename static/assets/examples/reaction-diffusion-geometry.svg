<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="580" height="215" font-family="sans-serif" font-size="15" fill="#000">
  <!-- Nonlinear reaction-diffusion in 1D -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <text x="290" y="40" font-size="18" text-anchor="middle">d<tspan dy="-6" font-size="11">2</tspan><tspan dy="6"><tspan font-style="italic">u</tspan>/d<tspan font-style="italic">x</tspan></tspan><tspan dy="-6" font-size="11">2</tspan><tspan dy="6">&#160;− <tspan font-style="italic">u</tspan><tspan dy="-6" font-size="11">2</tspan><tspan dy="6">&#160;= 0</tspan></tspan></text>
  <line x1="80" y1="100" x2="500" y2="100" stroke="#000" stroke-width="2"/>
  <circle cx="80" cy="100" r="4" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="500" cy="100" r="4" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="80" y="128" text-anchor="middle"><tspan font-style="italic">u</tspan>(0) = 1</text>
  <text x="80" y="144" font-size="12" fill="#666" text-anchor="middle">boundary "0"</text>
  <text x="500" y="128" text-anchor="middle">d<tspan font-style="italic">u</tspan>/d<tspan font-style="italic">x</tspan> = 0</text>
  <text x="500" y="144" font-size="12" fill="#666" text-anchor="middle">boundary "1"</text>
  <line x1="80" y1="175" x2="500" y2="175" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="195" text-anchor="middle">10</text>
</svg>
