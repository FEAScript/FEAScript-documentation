<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="580" height="340" font-family="sans-serif" font-size="15" fill="#000">
  <!-- 1D bi-material wall, interface at x = 0.075 m -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <clipPath id="bimaterial-0"><rect x="210" y="50" width="70" height="180"/></clipPath>
  <g clip-path="url(#bimaterial-0)" stroke="#000" stroke-width="1"><line x1="30" y1="230" x2="210" y2="50"/><line x1="44" y1="230" x2="224" y2="50"/><line x1="58" y1="230" x2="238" y2="50"/><line x1="72" y1="230" x2="252" y2="50"/><line x1="86" y1="230" x2="266" y2="50"/><line x1="100" y1="230" x2="280" y2="50"/><line x1="114" y1="230" x2="294" y2="50"/><line x1="128" y1="230" x2="308" y2="50"/><line x1="142" y1="230" x2="322" y2="50"/><line x1="156" y1="230" x2="336" y2="50"/><line x1="170" y1="230" x2="350" y2="50"/><line x1="184" y1="230" x2="364" y2="50"/><line x1="198" y1="230" x2="378" y2="50"/><line x1="212" y1="230" x2="392" y2="50"/><line x1="226" y1="230" x2="406" y2="50"/><line x1="240" y1="230" x2="420" y2="50"/><line x1="254" y1="230" x2="434" y2="50"/><line x1="268" y1="230" x2="448" y2="50"/></g>
  <clipPath id="bimaterial-0.075"><rect x="280" y="50" width="70" height="180"/></clipPath>
  <g clip-path="url(#bimaterial-0.075)" stroke="#000" stroke-width="1"><line x1="100" y1="230" x2="280" y2="50"/><line x1="128" y1="230" x2="308" y2="50"/><line x1="156" y1="230" x2="336" y2="50"/><line x1="184" y1="230" x2="364" y2="50"/><line x1="212" y1="230" x2="392" y2="50"/><line x1="240" y1="230" x2="420" y2="50"/><line x1="268" y1="230" x2="448" y2="50"/><line x1="296" y1="230" x2="476" y2="50"/><line x1="324" y1="230" x2="504" y2="50"/></g>
  <line x1="280" y1="50" x2="280" y2="230" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="210" y="50" width="140" height="180" fill="none" stroke="#000" stroke-width="2"/>
  <text x="194" y="115" text-anchor="end">Convection</text>
  <text x="194" y="136" text-anchor="end"><tspan font-style="italic">h</tspan> = 25 W/(m²·K)</text>
  <text x="194" y="157" text-anchor="end"><tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">∞</tspan><tspan dy="-4"></tspan> = 5 °C</text>
  <text x="194" y="178" font-size="12" fill="#666" text-anchor="end">boundary "0"</text>
  <text x="366" y="125">Constant temperature</text>
  <text x="366" y="146"><tspan font-style="italic">T</tspan> = 20 °C</text>
  <text x="366" y="167" font-size="12" fill="#666">boundary "1"</text>
  <text x="245" y="38" font-size="13" text-anchor="middle"><tspan font-style="italic">k</tspan> = 10</text>
  <text x="315" y="38" font-size="13" text-anchor="middle"><tspan font-style="italic">k</tspan> = 1</text>
  <line x1="210" y1="260" x2="350" y2="260" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="280" text-anchor="middle">0.15 m</text>
  <circle cx="210" cy="310" r="3" fill="#000" stroke="#000" stroke-width="1"/>
  <line x1="210" y1="310" x2="260" y2="310" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="268" y="315"><tspan font-style="italic">x</tspan></text>
  <text x="210" y="328" font-size="12" text-anchor="middle"><tspan font-style="italic">x</tspan> = 0</text>
</svg>
