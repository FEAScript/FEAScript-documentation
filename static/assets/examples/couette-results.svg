<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="15" fill="#000">
  <!-- Couette flow: velocity profile at x = 0 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g stroke="#000" stroke-width="0.6" stroke-opacity="0.25">
    <line x1="90" y1="30" x2="90" y2="300"/>
    <line x1="217.5" y1="30" x2="217.5" y2="300"/>
    <line x1="345" y1="30" x2="345" y2="300"/>
    <line x1="472.5" y1="30" x2="472.5" y2="300"/>
    <line x1="600" y1="30" x2="600" y2="300"/>
    <line x1="90" y1="300" x2="600" y2="300"/>
    <line x1="90" y1="232.5" x2="600" y2="232.5"/>
    <line x1="90" y1="165" x2="600" y2="165"/>
    <line x1="90" y1="97.5" x2="600" y2="97.5"/>
    <line x1="90" y1="30" x2="600" y2="30"/>
  </g>
  <line x1="90" y1="300" x2="600" y2="300" stroke="#000" stroke-width="1"/>
  <line x1="90" y1="30" x2="90" y2="300" stroke="#000" stroke-width="1"/>
  <text x="90" y="320" font-size="13" text-anchor="middle">0</text>
  <text x="217.5" y="320" font-size="13" text-anchor="middle">0.25</text>
  <text x="345" y="320" font-size="13" text-anchor="middle">0.5</text>
  <text x="472.5" y="320" font-size="13" text-anchor="middle">0.75</text>
  <text x="600" y="320" font-size="13" text-anchor="middle">1</text>
  <text x="82" y="304" font-size="13" text-anchor="end">0</text>
  <text x="82" y="236.5" font-size="13" text-anchor="end">0.5</text>
  <text x="82" y="169" font-size="13" text-anchor="end">1</text>
  <text x="82" y="101.5" font-size="13" text-anchor="end">1.5</text>
  <text x="82" y="34" font-size="13" text-anchor="end">2</text>
  <text x="345" y="346" text-anchor="middle"><tspan font-style="italic">u</tspan> (m/s)</text>
  <text x="24" y="165" text-anchor="middle" transform="rotate(-90 24 165)"><tspan font-style="italic">y</tspan> (m)</text>
  <polyline points="90,300 600,30" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="90" cy="300" r="3.5" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="217.5" cy="232.5" r="3.5" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="345" cy="165" r="3.5" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="472.5" cy="97.5" r="3.5" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="600" cy="30" r="3.5" fill="#fff" stroke="#000" stroke-width="1"/>
  <circle cx="124" cy="48" r="3.5" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="150" y="52" font-size="13" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">FEAScript, nodes at x = 0</text>
  <line x1="108" y1="70" x2="140" y2="70" stroke="#000" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="150" y="74" font-size="13" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Exact, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">y</tspan> / 2</text>
</svg>
