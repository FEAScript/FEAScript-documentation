<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif" font-size="15" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 1D domain -->
  <text x="40" y="40" font-size="16" font-weight="bold">1D</text>
  <line x1="60" y1="150" x2="300" y2="150" stroke="#000" stroke-width="2"/>
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <circle cx="60" cy="150" r="4"/>
    <circle cx="108" cy="150" r="4"/>
    <circle cx="156" cy="150" r="4"/>
    <circle cx="204" cy="150" r="4"/>
    <circle cx="252" cy="150" r="4"/>
    <circle cx="300" cy="150" r="4"/>
  </g>
  <text x="60" y="125" text-anchor="middle">"0"</text>
  <text x="300" y="125" text-anchor="middle">"1"</text>
  <text x="60" y="105" text-anchor="middle" font-size="12" fill="#555">left</text>
  <text x="300" y="105" text-anchor="middle" font-size="12" fill="#555">right</text>
  <line x1="60" y1="185" x2="300" y2="185" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="180" y="205" text-anchor="middle"><tspan font-style="italic">maxX</tspan></text>
  <text x="60" y="225" text-anchor="middle" font-size="13"><tspan font-style="italic">x</tspan> = 0</text>

  <!-- 2D domain -->
  <text x="400" y="40" font-size="16" font-weight="bold">2D</text>
  <rect x="430" y="70" width="240" height="140" fill="none" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="0.6" stroke-opacity="0.45">
    <line x1="490" y1="70" x2="490" y2="210"/>
    <line x1="550" y1="70" x2="550" y2="210"/>
    <line x1="610" y1="70" x2="610" y2="210"/>
    <line x1="430" y1="116.7" x2="670" y2="116.7"/>
    <line x1="430" y1="163.3" x2="670" y2="163.3"/>
  </g>
  <text x="550" y="230" text-anchor="middle">"0"</text>
  <text x="550" y="246" text-anchor="middle" font-size="12" fill="#555">bottom</text>
  <text x="414" y="145" text-anchor="end">"1"</text>
  <text x="414" y="161" text-anchor="end" font-size="12" fill="#555">left</text>
  <text x="550" y="60" text-anchor="middle">"2"</text>
  <text x="550" y="44" text-anchor="middle" font-size="12" fill="#555">top</text>
  <text x="686" y="145">"3"</text>
  <text x="686" y="161" font-size="12" fill="#555">right</text>
  <line x1="430" y1="272" x2="670" y2="272" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="550" y="292" text-anchor="middle"><tspan font-style="italic">maxX</tspan></text>
  <line x1="372" y1="70" x2="372" y2="210" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="362" y="140" text-anchor="middle" transform="rotate(-90 362 140)"><tspan font-style="italic">maxY</tspan></text>
  <circle cx="430" cy="210" r="3"/>
  <text x="424" y="262" text-anchor="middle" font-size="13">(0, 0)</text>
  <line x1="430" y1="210" x2="430" y2="250" stroke="#000" stroke-width="0.6" stroke-dasharray="2 2"/>
</svg>
