<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="sans-serif" font-size="15" fill="#000">
  <!-- NAFEMS T4: 0.6 m x 1.0 m plate, point E at (0.6, 0.2) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <polygon points="240,330 396,330 396,70 240,70" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <text x="318" y="352" text-anchor="middle"><tspan font-style="italic">T</tspan> = 100 °C</text>
  <text x="318" y="368" font-size="12" fill="#666" text-anchor="middle">boundary "0"</text>
  <text x="226" y="200" text-anchor="middle" transform="rotate(-90 226 200)">Insulated</text>
  <text x="210" y="200" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 210 200)">boundary "1" (unspecified)</text>
  <text x="318" y="58" text-anchor="middle">Convection, <tspan font-style="italic">h</tspan> = 750 W/(m²·K), <tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">∞</tspan><tspan dy="-4"></tspan> = 0 °C</text>
  <text x="318" y="40" font-size="12" fill="#666" text-anchor="middle">boundary "2"</text>
  <text x="416" y="200" text-anchor="middle" transform="rotate(90 416 200)">Convection</text>
  <text x="432" y="200" font-size="12" fill="#666" text-anchor="middle" transform="rotate(90 432 200)">boundary "3"</text>
  <text x="318" y="205" text-anchor="middle"><tspan font-style="italic">k</tspan> = 52 W/(m·K)</text>
  <circle cx="396" cy="278" r="4" fill="#000" stroke="#000" stroke-width="1"/>
  <text x="386" y="283" text-anchor="end">E</text>
  <text x="386" y="299" font-size="12" fill="#666" text-anchor="end">(0.6, 0.2)</text>
  <circle cx="240" cy="330" r="3" fill="#000" stroke="#000" stroke-width="1"/>
  <text x="234" y="350" font-size="13" text-anchor="middle">(0, 0)</text>
  <line x1="240" y1="400" x2="396" y2="400" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="318" y="420" text-anchor="middle">0.6 m</text>
  <line x1="170" y1="330" x2="170" y2="70" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="160" y="200" text-anchor="middle" transform="rotate(-90 160 200)">1.0 m</text>
