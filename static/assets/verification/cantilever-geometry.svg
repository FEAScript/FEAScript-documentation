<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" font-family="sans-serif" font-size="15" fill="#000">
  <!-- Cantilever beam: one cubic Hermite element, tip load P -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="100" y="115" width="400" height="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="65" x2="100" y2="175" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1">
    <line x1="100" y1="71" x2="88" y2="83"/>
    <line x1="100" y1="85" x2="88" y2="97"/>
    <line x1="100" y1="99" x2="88" y2="111"/>
    <line x1="100" y1="113" x2="88" y2="125"/>
    <line x1="100" y1="127" x2="88" y2="139"/>
    <line x1="100" y1="141" x2="88" y2="153"/>
    <line x1="100" y1="155" x2="88" y2="167"/>
    <line x1="100" y1="169" x2="88" y2="181"/>
  </g>
  <circle cx="100" cy="120" r="3" fill="#000" stroke="#000" stroke-width="1"/>
  <circle cx="500" cy="120" r="3" fill="#000" stroke="#000" stroke-width="1"/>
  <line x1="500" y1="40" x2="500" y2="110" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="58"><tspan font-style="italic">P</tspan> = −1000</text>
  <text x="512" y="76" font-size="12" fill="#666">node "2"</text>
  <text x="100" y="196" text-anchor="middle">Clamped</text>
  <text x="100" y="212" font-size="12" fill="#666" text-anchor="middle">node "1"</text>
  <text x="300" y="90" text-anchor="middle"><tspan font-style="italic">EI</tspan> = 10<tspan dy="-6" font-size="11">5</tspan><tspan dy="6">, one element</tspan></text>
  <line x1="100" y1="160" x2="500" y2="160" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="180" text-anchor="middle"><tspan font-style="italic">L</tspan> = 4</text>
</svg>
