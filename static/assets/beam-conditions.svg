<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="sans-serif" font-size="15" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Beam -->
  <rect x="100" y="165" width="500" height="10" fill="#fff" stroke="#000" stroke-width="2"/>

  <!-- Node 1: fixed (clamped) -->
  <line x1="100" y1="115" x2="100" y2="225" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1">
    <line x1="100" y1="121" x2="88" y2="133"/><line x1="100" y1="135" x2="88" y2="147"/>
    <line x1="100" y1="149" x2="88" y2="161"/><line x1="100" y1="163" x2="88" y2="175"/>
    <line x1="100" y1="177" x2="88" y2="189"/><line x1="100" y1="191" x2="88" y2="203"/>
    <line x1="100" y1="205" x2="88" y2="217"/>
  </g>

  <!-- Node 2: pinned + moment -->
  <path d="M350,175 L335,203 L365,203 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="322" y1="205" x2="378" y2="205" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1">
    <line x1="330" y1="205" x2="322" y2="215"/><line x1="342" y1="205" x2="334" y2="215"/>
    <line x1="354" y1="205" x2="346" y2="215"/><line x1="366" y1="205" x2="358" y2="215"/>
    <line x1="378" y1="205" x2="370" y2="215"/>
  </g>
  <path d="M376.15,160 A28,28 0 0 0 323.85,160" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="384" y="140" font-style="italic">M</text>

  <!-- Node 3: spring + point force -->
  <polyline points="600,175 600,186 612,193 588,207 612,221 588,235 600,242 600,250" fill="none" stroke="#000" stroke-width="1.5"/>
  <line x1="578" y1="250" x2="622" y2="250" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1">
    <line x1="586" y1="250" x2="578" y2="260"/><line x1="598" y1="250" x2="590" y2="260"/>
    <line x1="610" y1="250" x2="602" y2="260"/><line x1="622" y1="250" x2="614" y2="260"/>
  </g>
  <text x="620" y="215" font-style="italic">k</text>
  <line x1="600" y1="88" x2="600" y2="160" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="104" font-style="italic">F</text>

  <!-- Distributed load over the first span -->
  <line x1="100" y1="110" x2="350" y2="110" stroke="#000" stroke-width="1"/>
  <g stroke="#000" stroke-width="1" marker-end="url(#arrow)">
    <line x1="115" y1="110" x2="115" y2="162"/><line x1="145" y1="110" x2="145" y2="162"/>
    <line x1="175" y1="110" x2="175" y2="162"/><line x1="205" y1="110" x2="205" y2="162"/>
    <line x1="235" y1="110" x2="235" y2="162"/><line x1="265" y1="110" x2="265" y2="162"/>
    <line x1="295" y1="110" x2="295" y2="162"/>
  </g>
  <text x="225" y="100" text-anchor="middle"><tspan font-style="italic">q</tspan>(<tspan font-style="italic">x</tspan>)</text>

  <!-- Axes -->
  <line x1="30" y1="270" x2="75" y2="270" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="30" y1="270" x2="30" y2="225" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="80" y="275" font-style="italic">x</text>
  <text x="24" y="218" font-style="italic">w</text>

  <!-- Node labels and the matching boundary conditions -->
  <text x="100" y="300" text-anchor="middle" font-weight="bold" dx="40">node "1"</text>
  <text x="350" y="300" text-anchor="middle" font-weight="bold">node "2"</text>
  <text x="600" y="300" text-anchor="middle" font-weight="bold">node "3"</text>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <text x="140" y="324">[["fixed"]]</text>
    <text x="350" y="324">[["pinned"], ["moment", M]]</text>
    <text x="600" y="324">[["spring", k],</text>
    <text x="600" y="342">["force", F]]</text>
  </g>
</svg>
