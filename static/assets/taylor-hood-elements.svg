<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="560" height="310" font-family="sans-serif" font-size="15" fill="#000">

  <!-- Q2-Q1 quadrilateral -->
  <rect x="60" y="50" width="160" height="160" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="60" cy="210" r="4.5" fill="#000"/><circle cx="60" cy="130" r="4.5" fill="#000"/><circle cx="60" cy="50" r="4.5" fill="#000"/>
  <circle cx="140" cy="210" r="4.5" fill="#000"/><circle cx="140" cy="130" r="4.5" fill="#000"/><circle cx="140" cy="50" r="4.5" fill="#000"/>
  <circle cx="220" cy="210" r="4.5" fill="#000"/><circle cx="220" cy="130" r="4.5" fill="#000"/><circle cx="220" cy="50" r="4.5" fill="#000"/>
  <rect x="51" y="201" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/><rect x="51" y="41" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/><rect x="211" y="201" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/><rect x="211" y="41" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="140" y="248" text-anchor="middle" font-weight="bold">Q2–Q1 (quadrilateral)</text>

  <!-- P2-P1 triangle -->
  <path d="M330,210 L330,50 L490,210 Z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="330" cy="210" r="4.5" fill="#000"/><circle cx="330" cy="130" r="4.5" fill="#000"/><circle cx="330" cy="50" r="4.5" fill="#000"/>
  <circle cx="410" cy="210" r="4.5" fill="#000"/><circle cx="410" cy="130" r="4.5" fill="#000"/><circle cx="490" cy="210" r="4.5" fill="#000"/>
  <rect x="321" y="201" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/><rect x="321" y="41" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/><rect x="481" y="201" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="410" y="248" text-anchor="middle" font-weight="bold">P2–P1 (triangle)</text>

  <!-- Legend -->
  <circle cx="110" cy="286" r="4.5" fill="#000"/>
  <text x="124" y="291">velocity <tspan font-style="italic">u</tspan>, <tspan font-style="italic">v</tspan> (quadratic)</text>
  <rect x="321" y="277" width="18" height="18" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="346" y="291">pressure <tspan font-style="italic">p</tspan> (linear)</text>
</svg>
